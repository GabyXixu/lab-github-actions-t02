name: Pipeline DevOps

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  APP_NAME: lab-github-actions
  REGISTRY: docker.io
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.value }}
    env:
      BUILD_TARGET: production

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Imprimir contexto
        run: |
          echo "SHA: ${{ github.sha }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Evento: ${{ github.event_name }}"
          echo "Actor: ${{ github.actor }}"
          echo "Runner OS: ${{ runner.os }}"

      - name: Usar variables
        env:
          STEP_VAR: valor-local
        run: |
          echo "App: $APP_NAME"
          echo "Target: $BUILD_TARGET"
          echo "Step var: $STEP_VAR"

      - name: Generar tag de imagen
        id: tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "value=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: Usar el tag
        run: |
          echo "Tag: ${{ steps.tag.outputs.value }}"

      - name: Generar reporte
        run: |
          mkdir -p reports
          echo "Build: OK" > reports/build-report.txt
          echo "SHA: ${{ github.sha }}" >> reports/build-report.txt
          echo "Fecha: $(date -u)" >> reports/build-report.txt

      - name: Subir reporte
        uses: actions/upload-artifact@v4
        with:
          name: build-report
          path: reports/
          retention-days: 30

      - name: Login a Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push imagen
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/lab-github-actions:latest

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Simular tests
        run: echo "Tests pendientes - se implementan en el siguiente paso"

      - name: Usar tag del job anterior
        run: |
          echo "Tag recibido: ${{ needs['build-and-push'].outputs.image_tag }}"

      - name: Descargar reporte
        uses: actions/download-artifact@v4
        with:
          name: build-report
          path: reports/

      - name: Usar el reporte
        run: |
          cat reports/build-report.txt